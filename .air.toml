#:schema https://json.schemastore.org/any.json

env_files = []
root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  # Generate templ components BEFORE running go build
  cmd = "templ generate && go build -o ./tmp/main ./cmd/web/main.go"
  
  # Binary path
  bin = "./tmp/main"
  
  # Watch .templ files in addition to standard Go/HTML
  include_ext = ["go", "tpl", "tmpl", "html", "templ"]
  
  # Exclude generated _templ.go files from triggering endless loops
  exclude_regex = [".*_templ.go"]
  
  exclude_dir = ["assets", "tmp", "vendor"]
  delay = 1000

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  mode = ""
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = false

[misc]
  clean_on_exit = false

[proxy]
  app_port = 0
  app_start_timeout = 0
  enabled = false
  proxy_port = 0

[screen]
  clear_on_rebuild = false
  keep_scroll = true