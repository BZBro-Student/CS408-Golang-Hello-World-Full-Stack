root = "."
testdata_dir = "testing"
tmp_dir = "tmp"

[build]
  args_bin = []
  bin = "./tmp/main"
  # Ignores .templ files directly so Air doesn't double-trigger before generation finishes
  exclude_dir = ["assets", "tmp", "vendor"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  # Air will re-compile and restart when standard .go files OR generated _templ.go files change
  include_ext = ["go", "tpl", "tmpl", "html"]
  include_dir = []
  include_file = []
  delay = 1000 # Milliseconds to wait before rebuilding (gives Templ time to finish generating)
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  cmd = "go build -o ./tmp/main ./cmd/web/main.go"
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true